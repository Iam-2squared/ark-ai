[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ark-ai"
version = "0.1.0"
description = "Local-first ARK AI core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
local = ["llama-cpp-python>=0.3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ark = "ark.cli:main"
ark-bench = "ark.benchmark:main"
ark-v2 = "ark.intelligence.cli:main"
ark-eval = "ark.evaluation.runner:main"
ark-compare = "ark.evaluation.compare:main"
ark-ui = "ark.ui.server:main"
ark-launch = "ark.launcher:main"
ark-gate = "ark.gate:main"
ark-v3-dataset = "ark.learning.dataset_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
