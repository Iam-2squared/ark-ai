name: CI

on:
  push:
    branches: [main, feat/v1-local-core]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/ui/client.test.cjs
      # Exercise packaged resources and entrypoints, not only editable source imports.
      - run: python -m pip install . --no-deps --force-reinstall
      - run: ark-ui --help
      - run: ark-launch --help
      - run: ark-gate --help
      - run: python scripts/ui_smoke.py
      - run: ark-bench --config tests/fixtures/echo.toml --output benchmark-results/ci.json
      - run: ark-eval --output benchmark-results/v2-baseline.json
      - run: ark-eval --output benchmark-results/v2-candidate.json
      - run: ark-compare benchmark-results/v2-baseline.json benchmark-results/v2-candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}-${{ matrix.python-version }}
          path: benchmark-results/*.json
